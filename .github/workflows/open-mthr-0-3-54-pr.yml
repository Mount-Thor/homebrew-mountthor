name: open-mthr-0-3-54-pr

"on":
  push:
    branches:
      - bot/mthr-0.3.54-homebrew

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: open-mthr-0-3-54-pr
  cancel-in-progress: false

jobs:
  open:
    if: ${{ github.actor == 'mountthor-01' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: verify-bounded-formula-branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/bot/mthr-0.3.54-homebrew"
          test "$(git rev-parse HEAD^)" = "148e9e307887965f70bed31a08a011b05fa83620"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/open-mthr-0-3-54-pr.yml"
          test "$(sha256sum Formula/mthr.rb | awk '{print $1}')" = \
            "07acf38b172fa8dbf14644aa1ef901f40c31631ba90aa1721023467bc00d1d4a"
          ruby -c Formula/mthr.rb
          grep -Fq 'version "0.3.54"' Formula/mthr.rb
          test "$(grep -Fc 'https://get.mountthor.com/mthr/v0.3.54/' Formula/mthr.rb)" = 3
          ! grep -Fq 'Mount-Thor/mount-thor/releases' Formula/mthr.rb

      - name: remove-one-shot-launcher-and-open-pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/open-mthr-0-3-54-pr.yml
          git commit -m "Remove one-shot formula PR launcher"
          git push origin HEAD:bot/mthr-0.3.54-homebrew
          gh pr create \
            --repo Mount-Thor/homebrew-mountthor \
            --base main \
            --head bot/mthr-0.3.54-homebrew \
            --title "mthr 0.3.54" \
            --body "Publishes the exact Homebrew formula from Mount-Thor/mount-thor release run 31305149998. The formula branch was generated by release identity chris-mountthor; this PR is opened by github-actions[bot] so mountthor-01 can provide the protected branch's independent approval."
